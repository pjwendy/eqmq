[project]
name = "eqmq"
version = "0.1.0"
description = "MQ2-shaped Python SDK for EQEmu headless characters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["protobuf>=5.29"]
license = { text = "GPL-3.0-or-later" }

[project.urls]
Repository = "https://github.com/pjwendy/eqmq"
"Server module" = "https://github.com/pjwendy/Server/tree/headless"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eqmq*"]

[tool.setuptools.package-data]
"eqmq.viewer" = ["index.html"]
