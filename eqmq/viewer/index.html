<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eqmq Map Viewer</title>
<style>
  :root {
    --bg: #f4f2ec; --panel: #ffffffee; --text: #222; --muted: #777; --border: #d6d2c8;
    --pc: #1f6feb; --npc: #c0392b; --pet: #8e44ad; --bot: #16a085; --corpse: #888; --me: #e67e22; --target: #f1c40f;
    --hp: #d63a2f; --mana: #2f6fd6; --xp: #c99a0a; --aa: #8e44ad; --track: #e3dfd6; --kill: #c0392b; --loot: #b7791f; --plan: #6b46c1; --good: #2f855a;
    --chat: #1d7a8c; --trade: #9c5a1a;
    /* con colours, as the client shows them */
    --con-gray: #9a9a9a; --con-green: #2fa84f; --con-lblue: #3fb6e8; --con-blue: #1f4fd6; --con-white: #ffffff; --con-yellow: #e6c200; --con-red: #d63a2f;
    --outline: #333;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171a; --panel: #22252aee; --text: #e6e6e6; --muted: #999; --border: #3a3e45;
      --pc: #58a6ff; --npc: #ff6b5b; --pet: #c38fff; --bot: #3ddbb5; --corpse: #777; --me: #ffa94d; --target: #ffd43b;
      --hp: #ff6b5b; --mana: #6ea8ff; --xp: #f2c94c; --aa: #c38fff; --track: #33373e; --kill: #ff7b6e; --loot: #f6c25b; --plan: #b794f4; --good: #68d391;
      --chat: #5fd0e3; --trade: #e8a65d;
      --con-gray: #8a8a8a; --con-green: #4cd06a; --con-lblue: #6fd3ff; --con-blue: #4f7dff; --con-white: #f4f4f4; --con-yellow: #ffd93b; --con-red: #ff5b4b;
      --outline: #000;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171a; --panel: #22252aee; --text: #e6e6e6; --muted: #999; --border: #3a3e45;
    --pc: #58a6ff; --npc: #ff6b5b; --pet: #c38fff; --bot: #3ddbb5; --corpse: #777; --me: #ffa94d; --target: #ffd43b;
    --hp: #ff6b5b; --mana: #6ea8ff; --xp: #f2c94c; --aa: #c38fff; --track: #33373e; --kill: #ff7b6e; --loot: #f6c25b; --plan: #b794f4; --good: #68d391;
    --chat: #5fd0e3; --trade: #e8a65d;
    --con-gray: #8a8a8a; --con-green: #4cd06a; --con-lblue: #6fd3ff; --con-blue: #4f7dff; --con-white: #f4f4f4; --con-yellow: #ffd93b; --con-red: #ff5b4b;
    --outline: #000;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { position: absolute; left: 0; right: 0; bottom: 0; top: 34px; width: 100%; height: calc(100% - 34px); cursor: grab; touch-action: none; }
  canvas.drag { cursor: grabbing; }
  .panel { position: absolute; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; box-shadow: 0 2px 8px #0002; }
  #controls { top: 46px; left: 12px; max-width: calc(100% - 48px); display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  #controls label { white-space: nowrap; }
  #controls input[type=text] { width: 120px; }
  #controls input[type=number] { width: 56px; }
  button { font: inherit; padding: 2px 8px; }
  #status { bottom: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
  #status b { font-weight: 600; }
  #side { position: absolute; top: 46px; right: 12px; bottom: 56px; width: 270px; display: flex;
    flex-direction: column; gap: 8px; pointer-events: none; }
  #side .panel { position: relative; pointer-events: auto; }
  #legend { display: flex; flex-wrap: wrap; gap: 2px 10px; }
  .panel h3 { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #enemies .en { margin: 5px 0 2px; cursor: pointer; border-radius: 4px; padding: 1px 3px; } #enemies .en:hover { background: var(--border); }
  #enemies .en.tgt { outline: 1px solid var(--target, #e6b422); } #enemies .en .who { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
  #enemies .en .on { font-size: 11px; color: var(--muted); } #enemies .en .on b { color: #e0524a; font-weight: 600; }
  #enemies .bar i { background: linear-gradient(#d9b43a, #98781c); } #enemies .bar { height: 7px; }
  #enemies .st { display: inline-block; font-size: 10px; font-weight: 700; border-radius: 3px; padding: 0 4px; margin-left: 3px; color: #15110d; }
  #enemies .st.mez { background: #b07ad6; } #enemies .st.root { background: #6fbf73; } #enemies .st.stun { background: #e0c34c; } #enemies .st.fear { background: #e08a3c; }
  #enemies .st.charm { background: #4cc2c0; } #enemies .st.cast { background: #e0524a; color: #fff; }
  #group .member { margin: 6px 0 2px; }
  .buffrow { display: flex; flex-wrap: nowrap; gap: 1px; margin-top: 3px; overflow: hidden; } .buffrow .bf { position: relative; flex: 1 1 0; min-width: 6px; max-width: 24px; aspect-ratio: 1; border-radius: 2px; overflow: hidden; background: var(--border); cursor: default; }
  .buffrow .bf img { width: 100%; height: 100%; display: block; image-rendering: auto; } .buffrow .bf i { font: normal 9px/1 sans-serif; color: var(--muted); position: absolute; inset: 0; display: grid; place-items: center; }
  .buffrow .bf small { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font: 700 8px/1 sans-serif; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000, 0 0 3px #000; }
  #group .who { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
  #group .who b { font-weight: 600; }
  #group .who .lead::after { content: " \2605"; color: var(--me); }
  .bar { height: 5px; background: var(--track); border-radius: 3px; overflow: hidden; margin-top: 2px; }
  .bar i { display: block; height: 100%; transition: width .4s; }
  .bar.hp i { background: var(--hp); }
  .bar.mana i { background: var(--mana); }
  .bar.xp i { background: var(--xp); }
  .bar.aa i { background: var(--aa); }
  .xprow { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 11px; color: var(--muted); }
  .xprow .bar { flex: 1; margin: 0; height: 4px; }
  .xprow span { min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  .xprow b { font-weight: 600; min-width: 18px; }
  #entries { flex: 1; overflow-y: auto; font-size: 12px; line-height: 1.35; min-height: 0; }
  #entries div { padding: 2px 0; border-bottom: 1px solid var(--track); overflow-wrap: anywhere; }
  #entries .t { color: var(--muted); margin-right: 4px; font-variant-numeric: tabular-nums; }
  #entries .kill { color: var(--kill); }
  #entries .loot { color: var(--loot); }
  #entries .plan, #entries .decision { color: var(--plan); }
  #entries .chat { color: var(--chat); }
  #entries .trade { color: var(--trade); }
  #entries .zone { color: var(--mana); font-style: italic; }
  #plan dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; margin: 0; font-size: 12px; }
  #plan dt { color: var(--muted); }
  #plan dd { margin: 0; overflow-wrap: anywhere; }
  .con { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c);
    box-shadow: 0 0 0 1px var(--outline); vertical-align: -1px; margin-right: 3px; }
  #entries .level, #entries .good { color: var(--good); }
  #entries .level, #entries .death { font-weight: 600; }
  #entries .death { color: var(--kill); }
  #legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    margin-right: 6px; background: var(--c); vertical-align: -1px; }
  #legend span.sq::before { border-radius: 1px; }
  #legend .cons { flex-basis: 100%; display: flex; gap: 3px; align-items: center; color: var(--muted); font-size: 11px; }
  #legend .cons i { width: 14px; height: 9px; border-radius: 2px; background: var(--c); box-shadow: 0 0 0 1px var(--outline); }
  #tip { position: absolute; pointer-events: none; display: none; white-space: nowrap; }
  #error { top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; max-width: 80%; }
  .muted { color: var(--muted); }
  /* the bar over the map (the toolbar extras go in it) */
  #viewbar { position: absolute; top: 0; left: 0; right: 0; height: 34px; display: flex; align-items: center; gap: 6px;
    padding: 0 8px; background: var(--panel); border-bottom: 1px solid var(--border); z-index: 5; overflow-x: auto; white-space: nowrap; }
  #viewbar .tab { padding: 4px 14px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text); cursor: pointer; }
  #viewbar .tab.on { background: var(--text); color: var(--bg); font-weight: 600; }
  #viewbar .where { color: var(--muted); margin: 0 8px 0 4px; }
  /* the chat and the log, in a panel over the map: chat above, the log below (either can be turned off); resized from its corner */
  #chatpanel { left: 12px; bottom: 64px; width: min(560px, calc(100% - 330px)); height: 34vh; min-width: 260px; min-height: 120px;
    display: flex; flex-direction: column; gap: 6px; resize: both; overflow: hidden; box-sizing: border-box; }
  #chatpanel.nolog #actbox, #chatpanel.nochat #chatbox { display: none; }
  #chatbox { flex: 3; display: flex; flex-direction: column; min-height: 0; } #actbox { flex: 1.4; display: flex; flex-direction: column; min-height: 0; }
  /* every panel can be moved: by its grip (or its heading); where it was put is kept in this browser, as a fraction of the window */
  .panel .grip { position: absolute; top: 2px; right: 3px; width: 16px; height: 16px; cursor: move; touch-action: none; color: var(--muted);
    font: 12px/16px sans-serif; text-align: center; border-radius: 3px; user-select: none; opacity: .55; z-index: 1; }
  .panel .grip:hover { opacity: 1; background: var(--border); }
  .panel h3 { cursor: move; touch-action: none; user-select: none; }
  .panel.moved { position: fixed !important; right: auto !important; bottom: auto !important; transform: none !important; z-index: 4; }
  .panel.dragging { box-shadow: 0 0 0 2px var(--me), 0 2px 8px #0003; z-index: 6; }
  #controls, #status, #legend { padding-right: 24px; }
  .panehead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-bottom: 6px; }
  .panehead h3 { margin: 0; }
  .panehead label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  /* the chat window, as the client's: dark, every line of game text in its own colour */
  #chatwin { flex: 1; min-height: 0; overflow-y: auto; background: #0d0d10; color: #e6e6e6; border-radius: 6px; padding: 6px 8px;
    font: 12.5px/1.4 Verdana, "DejaVu Sans", sans-serif; }
  #chatwin div { overflow-wrap: anywhere; }
  #chatwin .t { color: #6b6b73; margin-right: 6px; font-variant-numeric: tabular-nums; display: none; }
  #chatwin.times .t { display: inline; }
  #chatwin.hide-chat .c-chat, #chatwin.hide-combat .c-combat, #chatwin.hide-spells .c-spells, #chatwin.hide-loot .c-loot,
  #chatwin.hide-other .c-other { display: none; }
  #chatwin .big { font-weight: 700; }
  #sidebtn, #tabs { display: none; }
  #tabs button { flex: 1; }
  #tabs button.on { font-weight: 600; }
  @media (max-width: 700px) {
    /* phones: the side panel is a sheet over the bottom of the map, opened with Info, one tab at a
       time (group, plan or log) so each gets the whole sheet */
    #sidebtn { display: inline-block; }
    #side { display: none; top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 60vh; }
    body.sheet #side { display: flex; }
    body.sheet #status { display: none; }
    #side #tabs { display: flex; gap: 6px; flex: none; padding: 6px; }
    #side > .panel:not(#tabs) { display: none; }
    body[data-tab="group"] #side > #group, body[data-tab="plan"] #side > #plan { display: block !important; flex: 1; overflow-y: auto; }
    /* the chat is the sheet's third tab; nothing is moved on a phone */
    #chatpanel { display: none; position: fixed !important; top: auto !important; left: 8px !important; right: 8px; bottom: 8px !important;
      width: auto !important; height: calc(60vh - 52px) !important; resize: none; z-index: 4; }
    body.sheet[data-tab="chat"] #chatpanel { display: flex; } body.sheet[data-tab="chat"] #side { height: 46px; bottom: calc(60vh - 40px); }
    .panel .grip { display: none; } .panel.moved { position: absolute !important; } #side .panel.moved { position: static !important; }
    #controls { top: 42px; left: 8px; max-width: calc(100% - 16px); }
  }
</style>
</head>
<body>
<div id="viewbar"><span class="tab on">Map</span><button class="tab" id="to3d" title="Watch this character in 3D, as the game draws it (the guild dashboard's player, fed by this map's stream)" hidden>3D</button><span class="where" id="where"></span><!--eqmq:controls--></div>
<canvas id="map"></canvas>
<div id="controls" class="panel">
  <button id="fit" title="Fit the whole zone">Fit</button>
  <button id="sidebtn" title="Group, plan and log">Info</button>
  <label><input type="checkbox" id="follow" checked> Follow bot</label>
  <span id="layers"></span>
  <label><input type="checkbox" id="labels" checked> Labels</label>
  <label title="Names and levels next to every spawn"><input type="checkbox" id="names"> Captions</label>
  <label title="Colour NPCs by how they con to you (grey, green, light blue, blue, white, yellow, red)"><input type="checkbox" id="concol" checked> Con colours</label>
  <label title="The server's navmesh: where characters can walk. The biggest piece is green; each other colour is a separate piece (island) a character can't walk to from the rest. Dashed lines are off-mesh links."><input type="checkbox" id="navmesh"> Navmesh<span id="navinfo" class="muted"></span></label>
  <label title="Where this character has been in the last half hour, coloured by what it was doing (the runner's trail; only on the guild's maps)" id="trailbox" style="display:none"><input type="checkbox" id="trail"> Trail</label>
  <label title="The zone's hunting areas, named, with which of our leaders is camped at each (the guild's maps only). Gold: this character's camp; blue: another leader's; purple: planned for a pair by the camp ladder, not yet held; grey: free. Hover one for its mobs and levels." id="campsbox" style="display:none"><input type="checkbox" id="camps" checked> Camps</label>
  <label title="Draw the radius each hostile NPC notices you in (the server's aggro range): red, those that attack on sight (KOS) and aren't grey to you; orange, those that may (threatening). Hover a mob to see its own, whatever this says."><input type="checkbox" id="aggro"> Aggro</label>
  <label title="Fade map and spawns far above or below the bot"><input type="checkbox" id="zfilter"> Height ±<input type="number" id="zrange" value="40" min="5" step="5"></label>
  <input type="text" id="filter" placeholder="Find spawn…">
</div>
<div id="side">
  <div id="tabs" class="panel"><button data-tab="group">Group</button><button data-tab="plan">Plan</button><button data-tab="chat">Chat</button></div>
  <div id="legend" class="panel">
    <span style="--c: var(--me)">You</span><span class="sq" style="--c: var(--pc)">Player</span><span class="sq" style="--c: var(--bot)">Bot</span>
    <span style="--c: var(--npc)">NPC</span><span style="--c: var(--pet)">Pet</span><span style="--c: var(--corpse)">Corpse</span>
    <div class="cons" id="conlegend">NPC con <i style="--c: var(--con-gray)"></i><i style="--c: var(--con-green)"></i><i style="--c: var(--con-lblue)"></i><i style="--c: var(--con-blue)"></i><i style="--c: var(--con-white)"></i><i style="--c: var(--con-yellow)"></i><i style="--c: var(--con-red)"></i></div>
  </div>
  <div id="group" class="panel"><h3>Group</h3><div id="members"><span class="muted">&mdash;</span></div></div>
  <div id="enemies" class="panel" hidden><h3>Enemies <span class="muted" id="encount"></span></h3><div id="enrows"></div></div>
  <div id="plan" class="panel" hidden><h3>Plan</h3><dl id="planrows"></dl></div>
</div>
<div id="chatpanel" class="panel">
  <div id="chatbox">
    <div class="panehead"><h3>Chat</h3>
      <label><input type="checkbox" data-f="chat" checked> Chat</label><label><input type="checkbox" data-f="combat" checked> Combat</label>
      <label><input type="checkbox" data-f="spells" checked> Spells</label><label><input type="checkbox" data-f="loot" checked> Loot &amp; coin</label>
      <label><input type="checkbox" data-f="other" checked> Other</label><label><input type="checkbox" id="chattimes"> Times</label><label title="The runner's log of what this character did, under the chat"><input type="checkbox" id="showlog" checked> Log</label></div>
    <div id="chatwin"></div>
  </div>
  <div id="actbox"><div class="panehead"><h3>Log</h3></div><div id="entries"></div></div>
</div>
<div id="status" class="panel"><span class="muted">Connecting…</span></div>
<div id="tip" class="panel"></div>
<div id="error" class="panel"></div>
<script>
"use strict";
// Map files store (-x, -y) of game coordinates. We draw in map space: canvas x = map x, canvas y = map y,
// which puts north up and east right. A spawn at game (x, y) is drawn at map (-x, -y).
// EQ heading is 0..512: 0 = north (+y), 128 = west (+x), counter-clockwise.
const $ = id => document.getElementById(id);
const canvas = $("map"), ctx = canvas.getContext("2d");
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const TYPE_COLOR = { PC: "--pc", NPC: "--npc", Pet: "--pet", Bot: "--bot", Corpse: "--corpse" };

let map = null, state = null, zone = null;
let nav = null, navKey = null, navGroups = null;
let view = { cx: 0, cy: 0, scale: 1 };       // map point at screen centre, pixels per unit
let layerOn = [];
let hover = null;
const prefs = load();

function load() { try { return JSON.parse(localStorage.getItem("eqmq-viewer") || "{}"); } catch { return {}; } }
function save() {
  try { localStorage.setItem("eqmq-viewer", JSON.stringify({
    labels: $("labels").checked, names: $("names").checked, zfilter: $("zfilter").checked, zrange: $("zrange").value,
    follow: $("follow").checked, navmesh: $("navmesh").checked, trail: $("trail").checked, camps: $("camps").checked, aggro: $("aggro").checked, concol: $("concol").checked,
    chatf: chatFilters(), times: $("chattimes").checked, showlog: $("showlog").checked })); } catch {}
}
for (const k of ["labels", "names", "zfilter", "follow", "navmesh", "trail", "camps", "aggro", "concol"]) if (k in prefs) $(k).checked = prefs[k];

// how a level cons to us: EQEmu's Mob::GetLevelCon (the SoF+ system, the server's default)
const CON_NAMES = { gray: "grey", green: "green", lblue: "light blue", blue: "blue", white: "white", yellow: "yellow", red: "red" };
function con(mine, other) {
  const diff = other - mine;
  if (diff === 0) return "white";
  if (diff >= 1 && diff <= 3) return "yellow";
  if (diff >= 4) return "red";
  const gray = mine - Math.trunc((mine + 5) / 3), green = mine - Math.trunc((mine + 7) / 4);
  if (mine <= 15) return diff <= -6 ? "gray" : "blue";
  if (other <= gray) return "gray";
  if (other <= green) return "green";
  return mine > 20 && diff <= -6 ? "lblue" : "blue";
}
const conColour = lvl => css("--con-" + con(state.me.level, lvl));
if (prefs.zrange) $("zrange").value = prefs.zrange;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr; canvas.height = canvas.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (needFit && canvas.clientWidth && canvas.clientHeight) { needFit = false; const following = $("follow").checked; fit(); $("follow").checked = following; }
  draw();
}

const toScreen = (mx, my) => [(mx - view.cx) * view.scale + canvas.clientWidth / 2, (my - view.cy) * view.scale + canvas.clientHeight / 2];
const toMap = (sx, sy) => [(sx - canvas.clientWidth / 2) / view.scale + view.cx, (sy - canvas.clientHeight / 2) / view.scale + view.cy];

let needFit = false;  // a fit asked for before the map had a size: done on the next resize
function fit() {
  if (!map || !map.layers.length) return;
  if (!canvas.clientWidth || !canvas.clientHeight) { needFit = true; return; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const layer of map.layers) for (const l of layer.lines) {
    x0 = Math.min(x0, l[0], l[3]); x1 = Math.max(x1, l[0], l[3]);
    y0 = Math.min(y0, l[1], l[4]); y1 = Math.max(y1, l[1], l[4]);
  }
  if (!isFinite(x0)) return;
  view.cx = (x0 + x1) / 2; view.cy = (y0 + y1) / 2;
  view.scale = 0.92 * Math.min(canvas.clientWidth / (x1 - x0 || 1), canvas.clientHeight / (y1 - y0 || 1));
  $("follow").checked = false; save();
  draw();
}

async function loadMap() {
  const r = await fetch("map"); map = await r.json();
  layerOn = map.layers.map(() => true);
  $("layers").innerHTML = map.layers.map((l, i) =>
    `<label><input type="checkbox" data-layer="${i}" checked> ${l.name}</label>`).join(" ");
  $("layers").querySelectorAll("input").forEach(el => el.onchange = () => { layerOn[+el.dataset.layer] = el.checked; draw(); });
  $("error").style.display = map.error ? "block" : "none";
  $("error").textContent = map.error ? map.error + ". Set EQMQ_MAPS to the client's maps folder." : "";
  const following = $("follow").checked;
  fit();
  $("follow").checked = following;
  save();  // fit() unticks follow; keep the user's choice
}

async function loadNav() {
  nav = null; navKey = null; $("navinfo").textContent = "";
  if (!$("navmesh").checked) return;
  try { nav = await (await fetch("navmesh")).json(); }
  catch { nav = { polys: [], links: [], islands: 0, error: "couldn't load the navmesh" }; }
  $("navinfo").textContent = nav.error ? " (none)" : ` (${nav.islands} island${nav.islands === 1 ? "" : "s"})`;
  $("navinfo").title = nav.error || "";
  draw();
}

const islandColour = i => i === 0 ? "#2f9e44" : `hsl(${(i * 137.508) % 360} 80% 55%)`;

// the navmesh as one path per colour (and in/out of the height window), in map coordinates
function navPaths(zw) {
  const key = zw ? Math.round(zw[0] / 5) + ":" + Math.round(zw[1] / 5) : "all";
  if (navKey === key) return navGroups;

function zWindow() {

  const r = +$("zrange").value || 40;

// the trail: the runner's places for this character, the last half hour (the guild's maps answer /trail; a plain viewer doesn't, and the box stays hidden)
let trailPts = [];
const TRAIL_COLOURS = ["#d9a441", "#5aa0e0", "#6fbf73", "#d9645a", "#b07ad6", "#4cc2c0", "#e08a3c", "#9aa4b2", "#e0c34c", "#d66aa5"], trailColour = new Map();

  try {

  } catch (e) { /* no trail here */ }
}
$("trail").addEventListener("change", () => { loadTrail(); try { save(); } catch (e) {} });
setInterval(loadTrail, 5000); loadTrail();
function drawTrail() {
  if (!$("trail").checked || trailPts.length < 2) return;

  let prev = null;

    if (p[2] !== zone) { prev = null; continue; }

// the camps: the zone's named hunting areas (the guild's maps answer /camps; a plain viewer doesn't, and the box stays hidden)
let campsData = null, hoveredId = 0, hoveredCamp = null;
const CAMP_R = 250;  // the camp soldier's pull radius, game units
async function loadCamps() {
  try {
    const r = await fetch("camps");
    if (!r.ok) return;
    $("campsbox").style.display = "";
    campsData = await r.json();
    draw();
  } catch (e) { /* no camps here */ }
}
$("camps").addEventListener("change", () => { try { save(); } catch (e) {} draw(); });
$("aggro").addEventListener("change", () => { try { save(); } catch (e) {} draw(); });
// what an NPC does about us, from the server's own aggro rules (the spawn's ar, as and ag): [text, colour] or null
const myInvisible = () => !!(state && state.me && (state.me.buffs || []).some(b => /invisib|shrink|camouflage|hide/i.test(b[0])));
function aggroOf(s) {
  if (s.t !== "NPC" || !(s.ar > 0)) return null;
  const c = state.me.level > 0 ? con(state.me.level, s.l) : "white", grey = c === "gray" && !(s.ag & 4);
  const range = Math.round(s.ar);
  if (s.ag & 1) return grey ? [`KOS, but grey to you: will not aggro (notices within ${range})`, "#9aa4b2"]
    : myInvisible() ? [`KOS, but you are invisible (notices within ${range})`, "#d9a441"]
    : [`<b>KOS: will aggro within ${range}</b>`, "#e0524a"];
  if (s.ag & 2) return grey ? [`threatening, but grey to you: will not aggro`, "#9aa4b2"] : [`threatening: may aggro (25% a look) within ${range}`, "#e08a3c"];
  return [`not hostile to you (notices within ${range})`, "#6fbf73"];
}
function drawAggro(w, h) {
  if (!state || !state.connected) return;
  const all = $("aggro").checked;
  for (const s of state.spawns) {
    if (s.t !== "NPC" || !(s.ar > 0)) continue;
    const a = aggroOf(s); if (!a) continue;
    const hot = a[1] === "#e0524a" || a[1] === "#e08a3c";
    if (!(s.id === hoveredId || (all && hot))) continue;
    const [sx, sy] = toScreen(-s.x, -s.y), r = s.ar * view.scale;
    if (sx < -r || sx > w + r || sy < -r || sy > h + r) continue;
    ctx.strokeStyle = a[1]; ctx.fillStyle = a[1]; ctx.lineWidth = s.id === hoveredId ? 2.5 : 1.2; ctx.globalAlpha = s.id === hoveredId ? 0.95 : 0.55;
    ctx.beginPath(); ctx.arc(sx, sy, Math.max(r, 3), 0, 7); ctx.stroke();
    ctx.globalAlpha = s.id === hoveredId ? 0.10 : 0.04; ctx.fill(); ctx.globalAlpha = 1;
    if (s.id === hoveredId && s.as > s.ar + 1) {  // it calls for help further than it notices: the assist radius, dashed
      ctx.setLineDash([5, 5]); ctx.strokeStyle = "#b07ad6"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(sx, sy, s.as * view.scale, 0, 7); ctx.stroke(); ctx.setLineDash([]);

setInterval(loadCamps, 10000); loadCamps();
let aggroedIds = new Set();
const niceName = n => String(n || "").replace(/_/g, " ").replace(/^#/, "").replace(/\d+$/, "").trim();
function drawCamps() {
  if (!$("camps").checked || !campsData || !state || !state.connected || campsData.zone !== state.zone) return;
  ctx.textBaseline = "middle"; ctx.font = "600 11px system-ui, sans-serif";
  for (const c of campsData.camps) {
    const [sx, sy] = toScreen(-c.x, -c.y), rr = CAMP_R * view.scale, mine = c.holders.includes(campsData.mine), held = c.holders.length > 0;
    if (sx < -rr - 120 || sx > canvas.clientWidth + rr + 120 || sy < -rr - 20 || sy > canvas.clientHeight + rr + 20) continue;
    const col = mine ? "#d9a441" : held ? "#5aa0e0" : c.planned ? "#b07ad6" : "#9aa4b2";
    ctx.globalAlpha = c === hoveredCamp ? 1 : mine ? 0.95 : 0.7;
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = mine || c === hoveredCamp ? 3 : 1.5; ctx.setLineDash(held ? [] : [6, 5]);

function draw() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.fillStyle = css("--bg"); ctx.fillRect(0, 0, w, h);
  if (!map) return;
  const zw = zWindow();
  const inZ = z => !zw || (z >= zw[0] && z <= zw[1]);
  const [vx0, vy0] = toMap(0, 0), [vx1, vy1] = toMap(w, h);
  drawNav(zw, w, h);
  aggroedIds = new Set(enemiesOf(state).map(s => s.id));
  drawCamps();
  drawTrail();
  drawAggro(w, h);

  // map lines, batched by colour and by in/out of the height window
  ctx.lineWidth = 1;
  map.layers.forEach((layer, i) => {
    if (!layerOn[i]) return;
    const paths = new Map();
    for (const l of layer.lines) {
      if (Math.max(l[0], l[3]) < vx0 || Math.min(l[0], l[3]) > vx1 || Math.max(l[1], l[4]) < vy0 || Math.min(l[1], l[4]) > vy1) continue;
      const key = l[6] + (inZ((l[2] + l[5]) / 2) ? "1" : "0");
      if (!paths.has(key)) paths.set(key, new Path2D());
      const p = paths.get(key), [ax, ay] = toScreen(l[0], l[1]), [bx, by] = toScreen(l[3], l[4]);
      p.moveTo(ax, ay); p.lineTo(bx, by);
    }
    for (const [key, p] of paths) {

      ctx.strokeStyle = colour; ctx.globalAlpha = key.endsWith("1") ? 1 : 0.15; ctx.stroke(p);
    }

      ctx.font = "11px system-ui, sans-serif"; ctx.textBaseline = "middle";
      for (const pt of layer.points) {
        const [sx, sy] = toScreen(pt[0], pt[1]);
        if (sx < -100 || sx > w + 100 || sy < -20 || sy > h + 20) continue;
        ctx.globalAlpha = inZ(pt[2]) ? 1 : 0.3;
        ctx.fillStyle = pt[3] === "#000000" && css("--bg").startsWith("#1") ? "#bbbbbb" : pt[3];
        ctx.beginPath(); ctx.arc(sx, sy, 2, 0, 7); ctx.fill();
        ctx.fillText(pt[5], sx + 4, sy);
      }
      ctx.globalAlpha = 1;
    }

  const filter = $("filter").value.trim().toLowerCase();
  const showNames = $("names").checked, conCol = $("concol").checked && state.me.level > 0;
  const outline = css("--outline");
  ctx.font = "11px system-ui, sans-serif"; ctx.textBaseline = "middle";

  const shape = (s, sx, sy, r) => {
    ctx.beginPath();

    else ctx.arc(sx, sy, r, 0, 7);
  };
  for (const s of state.spawns) {
    if (s.id === state.me.id) continue;
    const [sx, sy] = toScreen(-s.x, -s.y);
    if (sx < -20 || sx > w + 20 || sy < -20 || sy > h + 20) continue;
    const match = filter && s.n.toLowerCase().includes(filter);
    ctx.globalAlpha = (filter && !match) ? 0.2 : inZ(s.z) ? 1 : 0.25;
    const r = match ? 6 : 4;

    }
    if (s.ai) { ctx.strokeStyle = css("--me"); ctx.lineWidth = 2; shape(s, sx, sy, r + 3); ctx.stroke(); }
    if (aggroedIds.has(s.id)) { ctx.strokeStyle = "#e0524a"; ctx.lineWidth = 1.6; shape(s, sx, sy, r + 2); ctx.stroke(); }
    if (s.id === hoveredId) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5; shape(s, sx, sy, r + 5); ctx.stroke(); ctx.strokeStyle = "#000"; ctx.lineWidth = 1; shape(s, sx, sy, r + 7); ctx.stroke(); }
    if (s.id === state.me.target) {
      ctx.strokeStyle = css("--target"); ctx.lineWidth = 3; shape(s, sx, sy, r + 6); ctx.stroke();
    }
    if (showNames || match || s.id === state.me.target) {
      ctx.fillStyle = css("--text");
      ctx.fillText(s.t === "Corpse" ? s.n : `${s.n} (${s.l})`, sx + r + 4, sy);
    }
  }
  ctx.globalAlpha = 1;

  // the bot: an arrow along its heading
  const me = state.me, [mx, my] = toScreen(-me.x, -me.y);

  ctx.fillStyle = css("--me"); ctx.strokeStyle = css("--bg"); ctx.lineWidth = 2;

  ctx.lineTo(mx - dx * 7 + dy * 7, my - dy * 7 - dx * 7);

  ctx.fillStyle = css("--text"); ctx.font = "600 12px system-ui, sans-serif"; ctx.fillText(me.name, mx + 14, my);
}

function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// a spawn's con as a coloured dot (NPCs and players alike: it's how the level compares to ours)
function conDot(s) {

  const c = con(state.me.level, s.l);
  return `<span class="con" style="--c: var(--con-${c})" title="cons ${CON_NAMES[c]}"></span>`;
}

function updateStatus() {

  const me = state.me, target = state.spawns.find(s => s.id === me.target);
  document.title = `${me.name}: ${state.zone_name || state.zone}`;  // (the tab says who and where)
  // /loc order is y, x, z

    `<span>Loc ${me.y.toFixed(1)}, ${me.x.toFixed(1)}, ${me.z.toFixed(1)}</span>` +

const bar = (cls, pct) => `<div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(100, pct || 0))}%"></i></div>`;

// the enemies: what has the group on its hate list, or is hitting one of us (the client's extended target window): health, what is on it, who it is after
const STATUS = [[1, "mez", "MEZ", "mezzed"], [2, "root", "ROOT", "rooted"], [4, "stun", "STUN", "stunned"], [8, "fear", "FEAR", "feared or fleeing"], [16, "charm", "CHARM", "charmed"]];
function enemiesOf(st) {

  return st.spawns.filter(s => s.t === "NPC" && s.hp > 0 && (haters.has(s.id) || mine.has(s.tg))).sort((a, b) => (a.hp - b.hp) || (a.id - b.id));
}

  $("enrows").innerHTML = list.slice(0, 24).map(s => {
    const badges = STATUS.filter(([bit]) => s.st & bit).map(([, c, t, title]) => `<span class="st ${c}" title="${title}">${t}</span>`).join("") +
      (s.cs ? `<span class="st cast" title="casting spell ${s.cs}">CAST</span>` : "");
    const on = s.tg && names.has(s.tg) ? `<div class="on">&rarr; ${s.tg === st.me.id ? "<b>" + esc(names.get(s.tg)) + "</b>" : esc(names.get(s.tg))}</div>` : "";

const fmtTicksShort = t => { const s = t * 6; return s >= 3600 ? Math.round(s / 3600) + "h" : s >= 60 ? Math.round(s / 60) + "m" : s + "s"; };

  273: "#e6e6e6", 275: "#cfcfd6", 276: "#cfcfd6", 277: "#ff5b4b", 278: "#ffa94d", 279: "#b0b0b8", 280: "#80808a", 281: "#e6e6e6",

  301: "#ffd93b", 302: "#ffd93b", 303: "#ffa94d", 304: "#ff6b5b", 305: "#ff6b5b", 306: "#ff6b5b", 307: "#f2f2f2", 308: "#4fe6e6",

const chatFilters = () => Object.fromEntries([...document.querySelectorAll("#chatbox [data-f]")].map(b => [b.dataset.f, b.checked]));
function applyChatFilters() {
  const win = $("chatwin"), atBottom = win.scrollTop + win.clientHeight >= win.scrollHeight - 30;
  for (const [f, on] of Object.entries(chatFilters())) win.classList.toggle("hide-" + f, !on);
  win.classList.toggle("times", $("chattimes").checked);
  if (atBottom) win.scrollTop = win.scrollHeight;
}
let lastChat = 0;
function appendChat(entries) {
  if (!entries || !entries.length) return;
  const win = $("chatwin"), atBottom = win.scrollTop + win.clientHeight >= win.scrollHeight - 30;
  for (const e of entries) {
    if (e.id <= lastChat) continue;
    lastChat = e.id;
    const div = document.createElement("div");
    div.className = "c-" + chatGroup(e.k) + ([277, 301, 302].includes(e.k) ? " big" : "");
    div.style.color = CHAT_COLOUR[e.k] || "#e6e6e6";
    div.innerHTML = `<span class="t">${esc(e.t)}</span>${esc(e.x)}`;
    win.appendChild(div);
  }
  while (win.children.length > 1500) win.removeChild(win.firstChild);
  if (atBottom) win.scrollTop = win.scrollHeight;
}
for (const b of document.querySelectorAll("#chatbox [data-f], #chattimes")) b.onchange = () => { applyChatFilters(); save(); };
if (prefs.chatf) for (const b of document.querySelectorAll("#chatbox [data-f]")) if (b.dataset.f in prefs.chatf) b.checked = prefs.chatf[b.dataset.f];
$("chattimes").checked = !!prefs.times;
if ("showlog" in prefs) $("showlog").checked = !!prefs.showlog;
const applyShowLog = () => $("chatpanel").classList.toggle("nolog", !$("showlog").checked);
$("showlog").onchange = () => { applyShowLog(); save(); };

applyChatFilters();

// ---- every panel can be moved, as the 3D view's windows: dragged by its grip (or its heading), put where it was left (a fraction of
// the window, so a resize keeps it), the chat's size too; remembered in this browser. A double-click on the grip puts it back.
const PKEY = "eqmq-viewer-panels.v1", PIDS = ["controls", "legend", "group", "enemies", "plan", "chatpanel", "status"];
let PS = {}; try { PS = JSON.parse(localStorage.getItem(PKEY) || "{}") || {}; } catch { PS = {}; }
const savePanels = () => { try { localStorage.setItem(PKEY, JSON.stringify(PS)); } catch {} };
const phone = () => matchMedia("(max-width: 700px)").matches;
const TOP = 34;  // (the bar)
function applyPanels() {
  const W = innerWidth, H = innerHeight;
  for (const id of PIDS) {
    const el = $(id), st = PS[id] || {};
    if (!el) continue;
    if (st.x != null && !phone()) {
      el.classList.add("moved");
      const w = el.offsetWidth || 120, h = el.offsetHeight || 30;
      el.style.left = Math.max(0, Math.min(W - Math.min(w, 60), st.x * W)) + "px";
      el.style.top = Math.max(TOP, Math.min(H - Math.min(h, 24), st.y * H)) + "px";
      if (id === "status") el.style.maxWidth = "calc(100% - 24px)";
    } else {
      el.classList.remove("moved"); el.style.left = el.style.top = "";
    }
    if (id === "chatpanel" && st.w && !phone()) { el.style.width = st.w + "px"; el.style.height = st.h + "px"; }
    else if (id === "chatpanel") { el.style.width = el.style.height = ""; }
  }
}
for (const id of PIDS) {
  const el = $(id);
  if (!el) continue;
  const g = document.createElement("span");
  g.className = "grip"; g.textContent = "\u2725"; g.title = "Drag to move (double-click: back where it was)";
  el.appendChild(g);
  g.addEventListener("dblclick", () => { delete PS[id]; savePanels(); applyPanels(); });
}
let panelDrag = null;
document.addEventListener("pointerdown", e => {
  if (phone()) return;
  const handle = e.target.closest(".panel .grip, .panel h3");
  const el = handle && handle.closest(".panel");
  if (!el || !PIDS.includes(el.id)) return;
  const r = el.getBoundingClientRect();
  // (out of #side's column on its first move: fixed where it stands, so nothing jumps)
  el.classList.add("moved", "dragging"); el.style.left = r.left + "px"; el.style.top = r.top + "px";
  if (el.id === "status") el.style.maxWidth = "calc(100% - 24px)";
  panelDrag = { el, dx: e.clientX - r.left, dy: e.clientY - r.top };
  handle.setPointerCapture(e.pointerId); e.preventDefault();
});
document.addEventListener("pointermove", e => {
  if (!panelDrag) return;
  const { el, dx, dy } = panelDrag, w = el.offsetWidth, h = el.offsetHeight;
  const x = Math.max(0, Math.min(innerWidth - w, e.clientX - dx)), y = Math.max(TOP, Math.min(innerHeight - Math.min(h, 40), e.clientY - dy));
  el.style.left = x + "px"; el.style.top = y + "px";
  PS[el.id] = Object.assign(PS[el.id] || {}, { x: x / innerWidth, y: y / innerHeight });
});
const endPanelDrag = () => { if (panelDrag) { panelDrag.el.classList.remove("dragging"); panelDrag = null; savePanels(); } };
document.addEventListener("pointerup", endPanelDrag); document.addEventListener("pointercancel", endPanelDrag);
// the chat's size, once it has been resized by its corner (the browser's own resize handle)
{
  const cp = $("chatpanel"); let was = null;
  cp.addEventListener("pointerdown", () => { was = [cp.offsetWidth, cp.offsetHeight]; });
  addEventListener("pointerup", () => {
    if (!was || phone()) { was = null; return; }
    if (was[0] !== cp.offsetWidth || was[1] !== cp.offsetHeight) { PS.chatpanel = Object.assign(PS.chatpanel || {}, { w: cp.offsetWidth, h: cp.offsetHeight }); savePanels(); }
    was = null;
  });
}
applyPanels();
addEventListener("resize", applyPanels);
{ const w = $("chatwin"); w.scrollTop = w.scrollHeight; }

let lastLog = 0;
function appendLog(entries) {
  if (!entries || !entries.length) return;
  const box = $("entries"), atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  for (const e of entries) {
    if (e.id <= lastLog) continue;
    lastLog = e.id;
    const div = document.createElement("div");
    div.className = e.kind;
    div.innerHTML = `<span class="t">${esc(e.t)}</span>${esc(e.text)}`;
    box.appendChild(div);
  }
  while (box.children.length > 400) box.removeChild(box.firstChild);
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function connect() {
  const es = new EventSource("events");
  es.onmessage = async ev => {
    state = JSON.parse(ev.data);
    if (state.connected && state.zone !== zone) { zone = state.zone; await loadMap(); loadNav(); }
    if (state.connected && $("follow").checked) { view.cx = -state.me.x; view.cy = -state.me.y; }
    updateStatus(); draw(); showTip(); renderGroup(state.group); renderEnemies(state); renderPlan(state.plan); appendLog(state.log); appendChat(state.chat);
    if (state.connected) $("where").textContent = `${state.me.name} · ${state.zone_name}`;
    if (state.connected) {
      const b3 = $("to3d"), proxied = /^\/map\/\d+\//.test(location.pathname), ev = proxied ? location.pathname + "events" : location.origin + "/events";
      b3.hidden = false;
      b3.onclick = () => { location.href = (proxied ? "" : `${location.protocol}//${location.hostname}:8766`) + `/live?3d&leader=${encodeURIComponent(state.me.name)}&events=${encodeURIComponent(ev)}`; };
    }
    document.dispatchEvent(new CustomEvent("eqmq-state", { detail: state }));  // for plugins' controls
  };
  es.onerror = () => { $("status").innerHTML = '<span class="muted">Viewer disconnected, retrying…</span>'; };
}

// pan and zoom: drag with a mouse or one finger, zoom with the wheel or by pinching
const pointers = new Map();  // pointer id -> where it is on the canvas
let pinch = null;            // { d: finger distance, mx, my: the map point between the fingers }
const onCanvas = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
function zoomAt(sx, sy, factor) {
  // zoom about a screen point, keeping the map point under it where it is (unless following)
  const [bx, by] = toMap(sx, sy);
  view.scale = Math.min(Math.max(view.scale * factor, 0.01), 50);
  if (!$("follow").checked) { const [ax, ay] = toMap(sx, sy); view.cx += bx - ax; view.cy += by - ay; }
}
function startPinch() {
  const [a, b] = [...pointers.values()];
  const [mx, my] = toMap((a.x + b.x) / 2, (a.y + b.y) / 2);
  pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx, my };
}
canvas.addEventListener("pointerdown", e => {
  pointers.set(e.pointerId, onCanvas(e));
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add("drag");
  if (pointers.size === 2) startPinch();
  // a touch has no hover: a tap shows what's under the finger
  if (e.pointerType !== "mouse") { hover = pointers.size === 1 ? { ...onCanvas(e), px: e.clientX, py: e.clientY } : null; showTip(); }
});
canvas.addEventListener("pointermove", e => {
  const p = onCanvas(e), last = pointers.get(e.pointerId);
  if (last) {
    pointers.set(e.pointerId, p);
    if (pointers.size >= 2 && pinch) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      view.scale = Math.min(Math.max(view.scale * d / pinch.d, 0.01), 50);
      pinch.d = d;
      if (!$("follow").checked) {
        // the map point that was between the fingers stays between them (two-finger pan too)
        const [ax, ay] = toMap((a.x + b.x) / 2, (a.y + b.y) / 2);
        view.cx += pinch.mx - ax; view.cy += pinch.my - ay;
      }
      draw();
    } else if (pointers.size === 1) {
      view.cx -= (p.x - last.x) / view.scale; view.cy -= (p.y - last.y) / view.scale;
      if (hover) hover.moved = true;  // panning, not pointing at something
      if ($("follow").checked) { $("follow").checked = false; save(); }
      draw();
    }
  }
  if (e.pointerType === "mouse") { hover = { ...onCanvas(e), px: e.clientX, py: e.clientY }; showTip(); }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  pinch = null;
  if (pointers.size === 2) startPinch();
  if (!pointers.size) canvas.classList.remove("drag");
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") { hover = null; showTip(); } });
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  zoomAt(e.offsetX, e.offsetY, Math.exp(-e.deltaY * 0.0015));
  draw();
}, { passive: false });

function showTip() {
  const tip = $("tip");
  const off = () => { tip.style.display = "none"; if (hoveredId || hoveredCamp) { hoveredId = 0; hoveredCamp = null; draw(); } };
  if (!hover || !state || !state.connected || pinch || (pointers.size && hover.moved)) { off(); return; }
  // the nearest spawn within a generous reach (the dots are small, and a crowd of them is hard to point at)
  let best = null, bestD = 16;
  for (const s of state.spawns) {
    const [sx, sy] = toScreen(-s.x, -s.y), d = Math.hypot(sx - hover.x, sy - hover.y);
    if (d < bestD) { best = s; bestD = d; }
  }
  let camp = null;
  if (!best && $("camps").checked && campsData && campsData.zone === state.zone) {
    let cd = 1e9;
    for (const c of campsData.camps) {
      const [sx, sy] = toScreen(-c.x, -c.y), d = Math.hypot(sx - hover.x, sy - hover.y);
      if (d <= Math.max(CAMP_R * view.scale, 10) && d < cd) { camp = c; cd = d; }
    }
  }
  if (!best && !camp) { off(); return; }
  const id = best ? best.id : 0;
  if (id !== hoveredId || camp !== hoveredCamp) { hoveredId = id; hoveredCamp = camp; draw(); }
  if (best) {
    const kind = { NPC: "NPC", PC: "player", Bot: "bot", Pet: "pet", Corpse: "corpse" }[best.t] || best.t;
    tip.innerHTML = `${conDot(best)}<b>${esc(niceName(best.n))}</b> <span class="muted">level</span> <b>${best.l}</b> <span class="muted">${kind}${best.ai ? " · AI" : ""}</span><br>` +
      `${best.hp}% HP · loc ${best.y.toFixed(0)}, ${best.x.toFixed(0)}, ${best.z.toFixed(0)}` +
      (() => { const a = aggroOf(best); return a ? `<br><span style="color:${a[1]}">${a[0]}</span>` : ""; })() +
      (best.t === "NPC" && best.as > 0 && best.ar > 0 ? `<br><span class="muted">calls for help within ${Math.round(best.as)}</span>` : "");
  } else {
    const lv = camp.levels && camp.levels.length ? `level ${camp.levels[0]}${camp.levels[camp.levels.length - 1] !== camp.levels[0] ? "-" + camp.levels[camp.levels.length - 1] : ""}` : "";
    const mobs = [...new Set((camp.mobs || []).map(niceName))].slice(0, 6).join(", ");
    tip.innerHTML = `<b>${esc(camp.name)}</b> <span class="muted">${lv}</span><br>` +
      (mobs ? `${esc(mobs)}<br>` : "") +
      `<span class="muted">${camp.spawns ? camp.spawns + " spawns · " : ""}${camp.respawn_s ? "respawn " + Math.round(camp.respawn_s / 60) + " min · " : ""}</span>` +
      (camp.holders.length ? `held by <b>${esc(camp.holders.join(", "))}</b>` : "free") +
      (camp.planned ? `<br>planned by the ladder: <b>${esc(camp.planned)}</b>` : "");
  }
  tip.style.display = "block";
  tip.style.left = Math.min(hover.px + 14, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.min(hover.py + 14, innerHeight - tip.offsetHeight - 8) + "px";
}
