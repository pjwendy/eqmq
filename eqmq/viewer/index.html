<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eqmq Map Viewer</title>
<style>
  :root {
    --bg: #f4f2ec; --panel: #ffffffee; --text: #222; --muted: #777; --border: #d6d2c8;
    --pc: #1f6feb; --npc: #c0392b; --pet: #8e44ad; --bot: #16a085; --corpse: #888; --me: #e67e22; --target: #f1c40f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171a; --panel: #22252aee; --text: #e6e6e6; --muted: #999; --border: #3a3e45;
      --pc: #58a6ff; --npc: #ff6b5b; --pet: #c38fff; --bot: #3ddbb5; --corpse: #777; --me: #ffa94d; --target: #ffd43b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171a; --panel: #22252aee; --text: #e6e6e6; --muted: #999; --border: #3a3e45;
    --pc: #58a6ff; --npc: #ff6b5b; --pet: #c38fff; --bot: #3ddbb5; --corpse: #777; --me: #ffa94d; --target: #ffd43b;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas.drag { cursor: grabbing; }
  .panel { position: absolute; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; box-shadow: 0 2px 8px #0002; }
  #controls { top: 12px; left: 12px; max-width: calc(100% - 48px); display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  #controls label { white-space: nowrap; }
  #controls input[type=text] { width: 120px; }
  #controls input[type=number] { width: 56px; }
  button { font: inherit; padding: 2px 8px; }
  #status { bottom: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
  #status b { font-weight: 600; }
  #legend { top: 12px; right: 12px; display: flex; flex-direction: column; gap: 2px; }
  #legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    margin-right: 6px; background: var(--c); vertical-align: -1px; }
  #tip { position: absolute; pointer-events: none; display: none; white-space: nowrap; }
  #error { top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; max-width: 80%; }
  .muted { color: var(--muted); }
  @media (max-width: 600px) { #legend { display: none; } }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="controls" class="panel">
  <button id="fit" title="Fit the whole zone">Fit</button>
  <label><input type="checkbox" id="follow" checked> Follow bot</label>
  <span id="layers"></span>
  <label><input type="checkbox" id="labels" checked> Labels</label>
  <label><input type="checkbox" id="names"> Names</label>
  <label title="Fade map and spawns far above or below the bot"><input type="checkbox" id="zfilter"> Height ±<input type="number" id="zrange" value="40" min="5" step="5"></label>
  <input type="text" id="filter" placeholder="Find spawn…">
  <!--eqmq:controls-->
</div>
<div id="legend" class="panel">
  <span style="--c: var(--me)">You</span><span style="--c: var(--pc)">Player</span><span style="--c: var(--npc)">NPC</span>
  <span style="--c: var(--pet)">Pet</span><span style="--c: var(--bot)">Bot</span><span style="--c: var(--corpse)">Corpse</span>
</div>
<div id="status" class="panel"><span class="muted">Connecting…</span></div>
<div id="tip" class="panel"></div>
<div id="error" class="panel"></div>
<script>
"use strict";
// Map files store (-x, -y) of game coordinates. We draw in map space: canvas x = map x, canvas y = map y,
// which puts north up and east right. A spawn at game (x, y) is drawn at map (-x, -y).
// EQ heading is 0..512: 0 = north (+y), 128 = west (+x), counter-clockwise.
const $ = id => document.getElementById(id);
const canvas = $("map"), ctx = canvas.getContext("2d");
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const TYPE_COLOR = { PC: "--pc", NPC: "--npc", Pet: "--pet", Bot: "--bot", Corpse: "--corpse" };

let map = null, state = null, zone = null;
let view = { cx: 0, cy: 0, scale: 1 };       // map point at screen centre, pixels per unit
let layerOn = [];
let hover = null;
const prefs = load();

function load() { try { return JSON.parse(localStorage.getItem("eqmq-viewer") || "{}"); } catch { return {}; } }
function save() {
  try { localStorage.setItem("eqmq-viewer", JSON.stringify({
    labels: $("labels").checked, names: $("names").checked, zfilter: $("zfilter").checked, zrange: $("zrange").value,
    follow: $("follow").checked })); } catch {}
}
for (const k of ["labels", "names", "zfilter", "follow"]) if (k in prefs) $(k).checked = prefs[k];
if (prefs.zrange) $("zrange").value = prefs.zrange;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr; canvas.height = canvas.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

const toScreen = (mx, my) => [(mx - view.cx) * view.scale + canvas.clientWidth / 2, (my - view.cy) * view.scale + canvas.clientHeight / 2];
const toMap = (sx, sy) => [(sx - canvas.clientWidth / 2) / view.scale + view.cx, (sy - canvas.clientHeight / 2) / view.scale + view.cy];

function fit() {
  if (!map || !map.layers.length) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const layer of map.layers) for (const l of layer.lines) {
    x0 = Math.min(x0, l[0], l[3]); x1 = Math.max(x1, l[0], l[3]);
    y0 = Math.min(y0, l[1], l[4]); y1 = Math.max(y1, l[1], l[4]);
  }
  if (!isFinite(x0)) return;
  view.cx = (x0 + x1) / 2; view.cy = (y0 + y1) / 2;
  view.scale = 0.92 * Math.min(canvas.clientWidth / (x1 - x0 || 1), canvas.clientHeight / (y1 - y0 || 1));
  $("follow").checked = false; save();
  draw();
}

async function loadMap() {
  const r = await fetch("map"); map = await r.json();
  layerOn = map.layers.map(() => true);
  $("layers").innerHTML = map.layers.map((l, i) =>
    `<label><input type="checkbox" data-layer="${i}" checked> ${l.name}</label>`).join(" ");
  $("layers").querySelectorAll("input").forEach(el => el.onchange = () => { layerOn[+el.dataset.layer] = el.checked; draw(); });
  $("error").style.display = map.error ? "block" : "none";
  $("error").textContent = map.error ? map.error + ". Set EQMQ_MAPS to the client's maps folder." : "";
  const following = $("follow").checked;
  fit();
  $("follow").checked = following;
  save();  // fit() unticks follow; keep the user's choice
}

function zWindow() {
  if (!$("zfilter").checked || !state || !state.me) return null;
  const r = +$("zrange").value || 40;
  return [state.me.z - r, state.me.z + r];
}

function draw() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.fillStyle = css("--bg"); ctx.fillRect(0, 0, w, h);
  if (!map) return;
  const zw = zWindow();
  const inZ = z => !zw || (z >= zw[0] && z <= zw[1]);
  const [vx0, vy0] = toMap(0, 0), [vx1, vy1] = toMap(w, h);

  // map lines, batched by colour and by in/out of the height window
  ctx.lineWidth = 1;
  map.layers.forEach((layer, i) => {
    if (!layerOn[i]) return;
    const paths = new Map();
    for (const l of layer.lines) {
      if (Math.max(l[0], l[3]) < vx0 || Math.min(l[0], l[3]) > vx1 || Math.max(l[1], l[4]) < vy0 || Math.min(l[1], l[4]) > vy1) continue;
      const key = l[6] + (inZ((l[2] + l[5]) / 2) ? "1" : "0");
      if (!paths.has(key)) paths.set(key, new Path2D());
      const p = paths.get(key), [ax, ay] = toScreen(l[0], l[1]), [bx, by] = toScreen(l[3], l[4]);
      p.moveTo(ax, ay); p.lineTo(bx, by);
    }
    for (const [key, p] of paths) {
      let colour = key.slice(0, 7);
      if (colour === "#000000" && css("--bg").startsWith("#1")) colour = "#bbbbbb";  // black lines on a dark theme
      ctx.strokeStyle = colour; ctx.globalAlpha = key.endsWith("1") ? 1 : 0.15; ctx.stroke(p);
    }
    ctx.globalAlpha = 1;
    if ($("labels").checked && view.scale > 0.25) {
      ctx.font = "11px system-ui, sans-serif"; ctx.textBaseline = "middle";
      for (const pt of layer.points) {
        const [sx, sy] = toScreen(pt[0], pt[1]);
        if (sx < -100 || sx > w + 100 || sy < -20 || sy > h + 20) continue;
        ctx.globalAlpha = inZ(pt[2]) ? 1 : 0.3;
        ctx.fillStyle = pt[3] === "#000000" && css("--bg").startsWith("#1") ? "#bbbbbb" : pt[3];
        ctx.beginPath(); ctx.arc(sx, sy, 2, 0, 7); ctx.fill();
        ctx.fillText(pt[5], sx + 4, sy);
      }
      ctx.globalAlpha = 1;
    }
  });

  if (!state || !state.connected) return;
  const filter = $("filter").value.trim().toLowerCase();
  const showNames = $("names").checked;
  ctx.font = "11px system-ui, sans-serif"; ctx.textBaseline = "middle";
  for (const s of state.spawns) {
    if (s.id === state.me.id) continue;
    const [sx, sy] = toScreen(-s.x, -s.y);
    if (sx < -20 || sx > w + 20 || sy < -20 || sy > h + 20) continue;
    const match = filter && s.n.toLowerCase().includes(filter);
    ctx.globalAlpha = (filter && !match) ? 0.2 : inZ(s.z) ? 1 : 0.25;
    ctx.fillStyle = css(TYPE_COLOR[s.t] || "--npc");
    const r = match ? 6 : 4;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, 7); ctx.fill();
    if (s.ai) { ctx.strokeStyle = css("--me"); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx, sy, r + 3, 0, 7); ctx.stroke(); }
    if (s.id === state.me.target) {
      ctx.strokeStyle = css("--target"); ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(sx, sy, r + 6, 0, 7); ctx.stroke();
    }
    if (showNames || match || s.id === state.me.target) { ctx.fillStyle = css("--text"); ctx.fillText(s.n, sx + r + 4, sy); }
  }
  ctx.globalAlpha = 1;

  // the bot: an arrow along its heading
  const me = state.me, [mx, my] = toScreen(-me.x, -me.y);
  const a = me.heading / 512 * 2 * Math.PI, dx = -Math.sin(a), dy = -Math.cos(a);
  ctx.fillStyle = css("--me"); ctx.strokeStyle = css("--bg"); ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(mx + dx * 12, my + dy * 12);
  ctx.lineTo(mx - dx * 7 - dy * 7, my - dy * 7 + dx * 7);
  ctx.lineTo(mx - dx * 3, my - dy * 3);
  ctx.lineTo(mx - dx * 7 + dy * 7, my - dy * 7 - dx * 7);
  ctx.closePath(); ctx.stroke(); ctx.fill();
  ctx.fillStyle = css("--text"); ctx.font = "600 12px system-ui, sans-serif"; ctx.fillText(me.name, mx + 14, my);
}

function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function updateStatus() {
  const el = $("status");
  if (!state || !state.connected) { el.innerHTML = '<span class="muted">Bot not connected</span>'; return; }
  const me = state.me, target = state.spawns.find(s => s.id === me.target);
  // /loc order is y, x, z
  el.innerHTML = `<span><b>${esc(me.name)}</b> ${me.hp}% HP</span><span>${esc(state.zone_name)} (${esc(state.zone)})</span>` +
    `<span>Loc ${me.y.toFixed(1)}, ${me.x.toFixed(1)}, ${me.z.toFixed(1)}</span>` +
    `<span>Target: ${target ? esc(target.n) + " " + target.hp + "%" : '<span class="muted">none</span>'}</span>` +
    `<span class="muted">${state.spawns.length} spawns</span>`;
}

function connect() {
  const es = new EventSource("events");
  es.onmessage = async ev => {
    state = JSON.parse(ev.data);
    if (state.connected && state.zone !== zone) { zone = state.zone; await loadMap(); }
    if (state.connected && $("follow").checked) { view.cx = -state.me.x; view.cy = -state.me.y; }
    updateStatus(); draw(); showTip();
    document.dispatchEvent(new CustomEvent("eqmq-state", { detail: state }));  // for plugins' controls
  };
  es.onerror = () => { $("status").innerHTML = '<span class="muted">Viewer disconnected, retrying…</span>'; };
}

// pan and zoom
let drag = null;
canvas.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY }; canvas.classList.add("drag"); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", e => {
  if (drag) {
    view.cx -= (e.clientX - drag.x) / view.scale; view.cy -= (e.clientY - drag.y) / view.scale;
    drag = { x: e.clientX, y: e.clientY };
    if ($("follow").checked) { $("follow").checked = false; save(); }
    draw();
  }
  hover = { x: e.clientX, y: e.clientY }; showTip();
});
canvas.addEventListener("pointerup", () => { drag = null; canvas.classList.remove("drag"); });
canvas.addEventListener("pointerleave", () => { hover = null; showTip(); });
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const [bx, by] = toMap(e.offsetX, e.offsetY);
  view.scale *= Math.exp(-e.deltaY * 0.0015);
  view.scale = Math.min(Math.max(view.scale, 0.01), 50);
  if (!$("follow").checked) { const [ax, ay] = toMap(e.offsetX, e.offsetY); view.cx += bx - ax; view.cy += by - ay; }
  draw();
}, { passive: false });

function showTip() {
  const tip = $("tip");
  if (!hover || !state || !state.connected || drag) { tip.style.display = "none"; return; }
  let best = null, bestD = 10;
  for (const s of state.spawns) {
    const [sx, sy] = toScreen(-s.x, -s.y), d = Math.hypot(sx - hover.x, sy - hover.y);
    if (d < bestD) { best = s; bestD = d; }
  }
  if (!best) { tip.style.display = "none"; return; }
  tip.innerHTML = `<b>${esc(best.n)}</b> <span class="muted">${best.t} ${best.l}${best.ai ? " · AI" : ""}</span><br>` +
    `${best.hp}% HP · loc ${best.y.toFixed(0)}, ${best.x.toFixed(0)}, ${best.z.toFixed(0)}`;
  tip.style.display = "block";
  tip.style.left = Math.min(hover.x + 14, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.min(hover.y + 14, innerHeight - tip.offsetHeight - 8) + "px";
}

$("fit").onclick = fit;
for (const id of ["labels", "names", "zfilter", "zrange", "follow"]) $(id).addEventListener("change", () => { save(); draw(); });
$("filter").addEventListener("input", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
addEventListener("resize", resize);
resize();
connect();
</script>
<!--eqmq:script-->
</body>
</html>
